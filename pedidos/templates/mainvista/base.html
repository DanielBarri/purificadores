{% load static %}
<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aquosan Purificadores</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    </head>
    <body>
        <div class="animated-bg">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
            <div class="orb orb-4"></div>
        </div>

        <header class="site-header glass-panel">
            <nav class="site-nav container">
                <a class="brand" href="{% url 'tienda' %}">
                    <span class="material-symbols-outlined">water_drop</span>
                    Aquosan Purificadores
                </a>
                <div class="nav-links">
                    <a class="nav-link" href="{% url 'tienda' %}">Tienda</a>
                    <a class="nav-link" href="{% url 'pedidos' %}">Pedidos</a>
                    <a class="nav-link" href="/admin/" target="_blank">Panel Admin</a>

        </header>

        <main class="container page-content">{% block content %}{% endblock %}</main>

</html>
