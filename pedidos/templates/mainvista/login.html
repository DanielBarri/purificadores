{% extends 'mainvista/base.html' %} {% block content %}
<div class="auth-form glass-panel">
    <h2 class="page-title">Iniciar Sesión</h2>
    <form method="POST" class="auth-form__fields">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="form-field__error">{{ field.errors|striptags }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
    </form>
    <p class="auth-form__switch">
        ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a>
    </p>
</div>
{% endblock %}
