<div class="product-card glass-panel">
    <a href="{% url 'producto_detalle' producto.id %}" class="product-card__link">
        <div class="product-card__media">
            {% if producto.imagen %}
            <img
                src="{{ producto.imagen.url }}"
                class="product-card__image"
                alt="{{ producto.nombre }}" />
            {% else %}
            <div class="product-card__placeholder">
                <span>Sin imagen</span>
            </div>
            {% endif %}
            <span class="badge-glass product-card__category">{{ producto.get_categoria_display }}</span>
            {% if producto.agotado %}
            <span class="badge-glass badge-glass--out product-card__stock-tag">Agotado</span>
            {% endif %}
        </div>
        <div class="product-card__body">
            <h5 class="product-card__title">{{ producto.nombre }}</h5>
            <h6 class="product-card__price">${{ producto.precio }}</h6>
        </div>
    </a>
    <div class="product-card__footer">
        {% if producto.agotado %}
        <p class="product-card__unavailable">No disponible por el momento</p>
        {% else %}
        <form action="{% url 'agregar_al_carrito' producto.id %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary btn-block">
                <span class="material-symbols-outlined product-card__cart-icon">shopping_cart</span>
                Agregar al carrito
            </button>
        </form>
        {% endif %}
    </div>
</div>
